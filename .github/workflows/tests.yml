name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node for dashboard component tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n bin/scan_gmail.sh
          bash -n bin/macos_notifier.sh
          bash -n InterviewTracker.app/Contents/MacOS/InterviewTracker

      - name: Validate launchd templates
        run: plutil -lint launchd/*.plist InterviewTracker.app/Contents/Info.plist

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*_unit.py' -v

      - name: Run integration tests
        run: python3 -m unittest discover -s tests -p 'test_integration_*.py' -v
