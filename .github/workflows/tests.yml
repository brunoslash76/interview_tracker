name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node for dashboard component tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install coverage tooling
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run full quality gate with coverage
        run: bash scripts/run_checks.sh full

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
